title: "Filtering & Conditions"
description: "Use WHERE, AND, OR, NOT, IN, BETWEEN, and LIKE to filter exactly the data you need."
difficulty: beginner

tables:
  - name: sales
    description: "Coin trading records with amounts"
  - name: people
    description: "Person records with name, age, gender, and employment"
  - name: objects
    description: "Objects with color, weight, and boolean properties"
  - name: countries
    description: "Country records for IN keyword practice"
  - name: numbers
    description: "Simple number table for BETWEEN practice"
  - name: names
    description: "Names table for LIKE pattern matching"

tasks:
  - id: 1
    title: "WHERE — Your First Filter"
    instruction: |
      Often you don't want ALL rows — you want specific ones.
      The WHERE clause lets you filter rows by a condition:

        SELECT * FROM table_name
        WHERE column = 'value'

      Comparison operators you can use:
        =    equals
        !=   not equals (DuckDB also supports <>)
        >    greater than
        <    less than
        >=   greater than or equal
        <=   less than or equal

      Example:
        SELECT * FROM sales WHERE coin = 'AGK'
        --> Returns only rows where coin is 'AGK'

        SELECT * FROM sales WHERE amount <= 20
        --> Returns rows where amount is 20 or less

      YOUR TASK: Select all rows from 'sales' where the coin
      is 'AGK'.
    hint: "Write: SELECT * FROM sales WHERE coin = 'AGK'"
    order_matters: false

  - id: 2
    title: "AND — Multiple Conditions"
    instruction: |
      You can combine conditions using AND. Both conditions
      must be true for the row to be included:

        SELECT * FROM people
        WHERE gender = 'female' AND age < 20

      This returns only people who are BOTH female AND under 20.

      Think of AND as "I want ALL of these to be true."

      Example result from our people table:
        name   | age | gender
        Loopa  | 18  | female
      (Nohlas is female but age 24, so she's excluded)

      YOUR TASK: Fetch all people between ages 20 and 28
      (including 20 and 28). You need two conditions with AND.
    hint: "Write: SELECT * FROM people WHERE age >= 20 AND age <= 28"
    order_matters: false

  - id: 3
    title: "OR and NOT — Flexible Filters"
    instruction: |
      OR means "at least one condition must be true":
        SELECT * FROM people WHERE gender = 'female' OR age < 20
        --> Returns anyone who is female, OR anyone under 20

      NOT negates a condition:
        SELECT * FROM people WHERE NOT gender = 'male'
        --> Returns everyone who is NOT male

      IMPORTANT — parentheses matter!
        WHERE age > 20 AND age < 30 OR gender = 'female'
        vs
        WHERE age > 20 AND (age < 30 OR gender = 'female')
      These return DIFFERENT results! The first applies AND
      first (higher precedence), then OR. Use parentheses to
      be explicit about what you mean.

      YOUR TASK: Fetch all people who are either unemployed
      (employed = false) OR between ages 20 and 28 (inclusive),
      but exclude anyone who is exactly age 22.
    hint: "Use OR to combine the unemployed condition with the age range, then AND NOT for age 22: WHERE (employed IS NOT TRUE OR (age >= 20 AND age <= 28)) AND age != 22"
    order_matters: false

  - id: 4
    title: "Booleans — TRUE and FALSE"
    instruction: |
      Boolean columns store true/false values. In DuckDB, you
      can filter them elegantly:

        SELECT * FROM objects WHERE colorful IS TRUE
        SELECT * FROM objects WHERE colorful IS NOT TRUE
        SELECT * FROM objects WHERE colorful  -- same as IS TRUE

      DuckDB has native BOOLEAN type (true/false), unlike some
      databases that use 1/0. But both work:
        WHERE colorful = true   -- works
        WHERE colorful IS TRUE  -- also works (preferred)
        WHERE colorful          -- shorthand, also works

      YOUR TASK: Fetch all objects where 'colorful' is TRUE.
      Use the IS TRUE syntax.
    hint: "Write: SELECT * FROM objects WHERE colorful IS TRUE"
    order_matters: false

  - id: 5
    title: "IN — Match a List"
    instruction: |
      When you need to check if a value matches one of several
      options, IN is much cleaner than chaining OR:

      Instead of:
        WHERE col = 'a' OR col = 'b' OR col = 'c'

      Write:
        WHERE col IN ('a', 'b', 'c')

      IN works with numbers too:
        WHERE id IN (1, 5, 10, 15)

      YOUR TASK: Return all records from 'countries' where the
      country is one of: Oman, Nicaragua, Bhutan, Senegal, Belarus.
    hint: "Write: SELECT * FROM countries WHERE country IN ('Oman', 'Nicaragua', 'Bhutan', 'Senegal', 'Belarus')"
    order_matters: false

  - id: 6
    title: "BETWEEN — Range Queries"
    instruction: |
      BETWEEN is a shorthand for range conditions (inclusive on
      both ends):

      Instead of:
        WHERE col >= 5 AND col <= 10

      Write:
        WHERE col BETWEEN 5 AND 10

      BETWEEN works with numbers, dates, and even strings!
        WHERE order_date BETWEEN '2024-01-01' AND '2024-12-31'

      YOUR TASK: Fetch all records from 'numbers' where the
      value is between 5 and 10 (inclusive).
    hint: "Write: SELECT * FROM numbers WHERE value BETWEEN 5 AND 10"
    order_matters: false

  - id: 7
    title: "LIKE — Pattern Matching"
    instruction: |
      LIKE lets you search for patterns in text using wildcards:

        %  matches any number of characters (including zero)
        _  matches exactly one character

      Examples:
        'k%'     starts with k
        '%a'     ends with a
        '%ing%'  contains 'ing'
        '_a%'    second character is 'a'
        'A___'   exactly 4 chars starting with A

      DuckDB also supports ILIKE for case-insensitive matching:
        WHERE name ILIKE 'k%a'  -- matches Kara, kendra, etc.

      Use LIKE in a WHERE clause:
        SELECT * FROM names WHERE name LIKE 'k%a'

      YOUR TASK: Fetch all people from 'names' whose name starts
      with 'k' and ends with 'a'. Order results by name DESC.
    hint: "Write: SELECT * FROM names WHERE name LIKE 'k%a' ORDER BY name DESC"
    expected_columns: ["id", "name"]
    order_matters: true

  - id: 8
    title: "Combining Everything"
    instruction: |
      Let's put it all together! Real queries often combine
      multiple filtering techniques:

        SELECT name, weight
        FROM objects
        WHERE category IN ('tool', 'stationery')
          AND weight BETWEEN 0.1 AND 1.5
          AND name LIKE '%e%'
        ORDER BY weight DESC

      This finds tools/stationery, weighing 0.1-1.5, with 'e'
      in the name, sorted heaviest first.

      YOUR TASK: From the 'objects' table, fetch the 'id' and
      'name' of all objects that:
        - Are in category 'tool' or 'stationery'
        - Have weight greater than 0.1
        - Have a name that contains the letter 'e'
      Order by weight in ascending order.
    hint: "Combine IN, >, and LIKE with AND, then ORDER BY weight ASC"
    expected_columns: ["id", "name"]
    order_matters: true
