title: "JOINs"
description: "Connect data across tables using INNER JOIN, LEFT JOIN, and more — the key to relational thinking."
difficulty: intermediate

tables:
  - name: customers
    description: "Customer profiles"
  - name: orders
    description: "Customer orders with amounts"
  - name: products
    description: "Product catalog"
  - name: order_items
    description: "Line items linking orders to products"

tasks:
  - id: 1
    title: "Your First JOIN"
    instruction: |
      Write an INNER JOIN between `orders` and `customers` to show each order alongside its customer's name.

      Select `customers.name`, `orders.id` (as `order_id`), and `orders.total_amount`.
    hint: "Use `SELECT c.name, o.id AS order_id, o.total_amount FROM orders o JOIN customers c ON o.customer_id = c.id`"
    expected_columns: ["name", "order_id", "total_amount"]
    order_matters: false

  - id: 2
    title: "LEFT JOIN — Keep Everyone"
    instruction: |
      Use a LEFT JOIN to list ALL customers and their orders. Customers without orders should still appear (with NULL values for order columns).

      Select `customers.name` and `orders.id` (as `order_id`).
    hint: "Use `LEFT JOIN` — it keeps all rows from the left table"
    expected_columns: ["name", "order_id"]
    order_matters: false

  - id: 3
    title: "Customers Without Orders"
    instruction: |
      Find customers who have **never placed an order**. Select only `name`.

      This is a classic LEFT JOIN + WHERE NULL pattern.
    hint: "LEFT JOIN orders, then `WHERE orders.id IS NULL`"
    expected_columns: ["name"]
    order_matters: false

  - id: 4
    title: "Three-Table JOIN"
    instruction: |
      Join `orders`, `order_items`, and `products` to show what was ordered.

      Select `orders.id` as `order_id`, `products.name` as `product_name`, and `order_items.quantity`.
    hint: "Chain two JOINs: orders → order_items → products"
    expected_columns: ["order_id", "product_name", "quantity"]
    order_matters: false

  - id: 5
    title: "JOIN with Aggregation"
    instruction: |
      For each customer, calculate the **total amount** they've spent across all orders.

      Select `customers.name` and `SUM(orders.total_amount)` as `total_spent`. Order by `total_spent` descending.
    hint: "JOIN + GROUP BY + SUM + ORDER BY"
    expected_columns: ["name", "total_spent"]
    order_matters: true

  - id: 6
    title: "Self-Referencing Concept"
    instruction: |
      Find all pairs of customers who live in the **same city**. Select `c1.name` as `customer_1`, `c2.name` as `customer_2`, and `c1.city`.

      Make sure each pair appears only once (c1.id < c2.id).
    hint: "JOIN customers to itself: `FROM customers c1 JOIN customers c2 ON c1.city = c2.city AND c1.id < c2.id`"
    expected_columns: ["customer_1", "customer_2", "city"]
    order_matters: false

  - id: 7
    title: "CROSS JOIN"
    instruction: |
      Generate all possible customer-product combinations using a CROSS JOIN.

      Select `customers.name` and `products.name` as `product_name`. Only include customers with id <= 3 and products with id <= 3 (to keep it small).
    hint: "CROSS JOIN produces every combination. Filter with WHERE."
    expected_columns: ["name", "product_name"]
    order_matters: false

  - id: 8
    title: "DuckDB DISTINCT ON"
    instruction: |
      This is a DuckDB/PostgreSQL specialty! Find the **most recent order** for each customer placed on or before '2024-06-01'.

      Use `DISTINCT ON (customer_id)` with `ORDER BY customer_id, order_date DESC` inside a subquery, then JOIN with customers.

      Select `customers.name`, `orders.id` as `order_id`, and `orders.order_date`.

      **DuckDB tip**: `DISTINCT ON` keeps only the first row per group (based on ORDER BY), which is perfect for "latest per group" queries.
    hint: "Subquery: `SELECT DISTINCT ON (customer_id) * FROM orders WHERE order_date <= '2024-06-01' ORDER BY customer_id, order_date DESC` — then LEFT JOIN with customers"
    expected_columns: ["name", "order_id", "order_date"]
    order_matters: false

