Summary: Learn modern SQL & DuckDB analytics locally
Description: |-
  Learn DuckDB is an interactive, privacy-first SQL learning environment
  and analytical playground designed to master modern SQL directly on your
  device. Powered by DuckDB-Wasm running completely locally with zero telemetry.

